name: Build naruzhu APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - uses: actions/checkout@v4

      - name: Download project
        run: |
          wget -O project.zip https://github.com/ermolovartem76-art/Hjjjk/releases/download/Ggg/naruzhu_app_updated-3.zip
          mkdir -p project
          unzip -o project.zip -d project

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.7.1.stable ~/.local/share/godot/export_templates/4.7.1.stable

      - name: Import project
        run: |
          cd project/naruzhu_app_updated-3/naruzhu_app_updated/naruzhu_app
          godot --headless --editor --quit || true

      - name: Export Android APK (debug)
        run: |
          cd project/naruzhu_app_updated-3/naruzhu_app_updated/naruzhu_app
          mkdir -p build
          godot --headless --export-debug "Android" build/naruzhu.apk

      - uses: actions/upload-artifact@v4
        with:
          name: naruzhu-apk
          path: project/naruzhu_app_updated-3/naruzhu_app_updated/naruzhu_app/build/naruzhu.apk
